[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlrc-mac"
version = "0.4.0"
description = "macOS-focused OpenLRC fork with local whisper.cpp transcription and optional llama.cpp translation."
authors = [
    { name = "OpenLRC Mac contributors" },
]
requires-python = ">=3.10, <3.13"
readme = "README.md"
license = "MIT"
keywords = ["whisper.cpp", "llama.cpp", "macos", "subtitle", "lrc", "srt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
]
dependencies = [
    "openai>=2.20.0",
    "anthropic>=0.90.0",
    "tiktoken>=0.8.0,<0.9",
    "langcodes>=3.3.0,<4",
    "language-data~=1.1",
    "tqdm>=4.65.0,<5",
    "audioread>=3.0.0,<4",
    "zhconv>=1.4.3,<2",
    "colorlog>=6.7.0,<7",
    "click>=8.1,<9",
    "ffmpeg-python>=0.2.0,<0.3",
    "lingua-language-detector>=1.3.2,<2",
    "filetype>=1.2.0,<2",
    "jaconvV2>=0.4,<0.5",
    "spacy>=3.8.5,<4",
    "pysbd>=0.3.4,<0.4",
    "ffmpeg-normalize>=1.27.5,<2",
    "google-genai>=1.70.0",
    "json_repair==0.25.2",
    "onnxruntime>=1.20.0,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20.0,<2; python_version >= '3.11'",
    "rich>=13,<15",
    "typer>=0.12,<1",
    "textual>=8.2,<9",
    "keyring>=25.7,<26",
]

[project.scripts]
openlrc = "openlrc.cli.main:main"
openlrc-mac = "openlrc.cli.main:main"
openlrc-tui = "openlrc.tui.app:run"

[project.optional-dependencies]
# Noise suppression via DeepFilterNet (requires torch).
# Install with: pip install openlrc-mac[full]
# Only needed when using noise_suppress=True in LRCer.run() or Preprocessor.run().
full = [
    "torch>=2.6.0",
    "torchaudio>=2.0.0",
    "deepfilternet>=0.5.6,<0.6",
]
litellm = [
    "litellm>=1.60,<1.85",
]

[dependency-groups]
dev = ["pyright>=1.1", "pytest>=8.3,<9", "ruff>=0.11"]

[tool.uv]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["openlrc"]
split-on-trailing-comma = false

[tool.pyright]
pythonVersion = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv", ".uv-cache"]

[tool.hatch.build.targets.sdist]
include = [
    "openlrc",
    "README.md",
    "CLI_REFERENCE.md",
    "TUI_REFERENCE.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
include = ["openlrc"]
