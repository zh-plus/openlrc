<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenLRC Desktop</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme-source="light"]) {
          background: #242424;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
